<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Redirect URL registrada en Enable Banking (Open Banking). El banco vuelve aquí con
       ?code=…&state=… y esta página se los pasa a la app por finiverse://enablebanking-callback.
       Sin analytics, fuentes ni scripts externos: el código del banco no debe salir de aquí. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Volviendo a Finiverse</title>
  <style>
    :root { --bg: #F7F7FB; --card: #FFFFFF; --text: #1E1B4B; --soft: #5B5A75; --accent: #4F46E5; --on-accent: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121225; --card: #1C1C33; --text: #F1F0FF; --soft: #B4B3CC; --accent: #8B85FF; --on-accent: #121225; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--soft); }
    a.button {
      display: inline-block; min-height: 48px; padding: 12px 28px; border-radius: 14px;
      background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Volviendo a Finiverse…</h1>
    <p id="body">Si la app no se abre sola, toca el botón.</p>
    <a class="button" id="open" href="finiverse://enablebanking-callback">Abrir Finiverse</a>
  </main>
  <script>
    (function () {
      var src = new URLSearchParams(window.location.search);
      var out = new URLSearchParams();
      ["code", "state", "error", "error_description"].forEach(function (k) {
        if (src.has(k)) out.set(k, src.get(k));
      });
      var dest = "finiverse://enablebanking-callback?" + out.toString();
      // Saca el código de la barra de direcciones e historial antes de salir.
      history.replaceState(null, "", window.location.pathname);
      document.getElementById("open").href = dest;

      if (!/^es\b/i.test(navigator.language || "")) {
        document.documentElement.lang = "en";
        document.title = "Returning to Finiverse";
        document.getElementById("title").textContent = "Returning to Finiverse…";
        document.getElementById("body").textContent = "If the app doesn't open on its own, tap the button.";
        document.getElementById("open").textContent = "Open Finiverse";
      }
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
